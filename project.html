<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model Viewer</title>
    <link rel="stylesheet" href="css/main.css">
</head>

<body>

    <!-- Основной контейнер -->
    <div class="project-container">

        <div class="control-buttons">
            <!-- Кнопка возврата -->
            <a href="index.html" class="back-button">
                <svg>
                    <use xlink:href="assets/icons/sprite.svg#house"></use>
                </svg>
                <span>Назад</span>
            </a>

            <!-- Правая группа кнопок -->
            <div class="button-group">
                <!-- Кнопка переключения 3D/2D -->
                <button type="button" id="toggle-3d-2d-btn" class="toggle-3d-2d-button" aria-label="Переключить 2D/3D">
                    <svg>
                        <use xlink:href="assets/icons/sprite.svg#image"></use>
                    </svg>
                </button>

                <!-- Кнопка развертывания -->
                <button type="button" id="toggle-fullscreen-btn" class="expand-button" aria-label="Полноэкранный режим">
                    <svg>
                        <use xlink:href="assets/icons/sprite.svg#expand"></use>
                    </svg>
                </button>

                <!-- Кнопка настроек -->
                <button type="button" id="settings-btn" class="settings-button" aria-label="Настройки">
                    <svg>
                        <use xlink:href="assets/icons/sprite.svg#gear"></use>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Контейнер для 3D модели (по умолчанию активен) -->
        <div class="model-container active" id="model-container">
            <canvas id="viewer"></canvas>
        </div>

        <!-- Контейнер для 2D чертежей (по умолчанию скрыт) -->
        <div class="drawing-container" id="drawing-container">
            <div class="drawing-wrapper">
                <img id="drawing-image" class="drawing-image no-save" alt="Чертеж детали">
                <div class="drawing-placeholder" id="drawing-placeholder">
                    <svg>
                        <use xlink:href="assets/icons/sprite.svg#cube"></use>
                    </svg>
                    <p>Выберите деталь в таблице для просмотра чертежа</p>
                </div>
            </div>

            <div class="drawing-controls">
                <!-- Кнопки навигации по чертежам будут добавляться сюда динамически -->
            </div>
        </div>

        <!-- Резиновый разделитель контейнеров для 3D/2D -->
        <div class="resize-handle" id="resize-handle">
            <div class="resize-handle-line"></div>
            <button type="button" id="view-toggle-btn" class="view-toggle-button" aria-label="Переключить вкладку спецификация/раскрой">
                <svg>
                    <use xlink:href="assets/icons/sprite.svg#cut"></use>
                </svg>
            </button>
        </div>

        <!-- Панель информации -->
        <div class="info-panel">

            <div class="tab-content">
                <!-- Вкладка спецификации -->
                <div class="tab-pane active" id="specification">
                    <table class="spec-table">
                        <thead>
                            <tr>
                                <th>Обозначение</th>
                                <th>Наименование</th>
                                <th>Кол</th>
                            </tr>
                        </thead>
                        <tbody id="specification-body"></tbody>
                    </table>
                </div>

                <!-- Вкладка Раскрой -->
                <div id="cutting" class="tab-pane">
                    <div class="cutting-full">
                        <div class="cutting-controls">

                            <div class="controls-grid">
                                <div class="control-group">
                                    <label for="stockLengthSelect">Длина заготовки:</label>
                                    <select id="stockLengthSelect">
                                        <option value="6000" selected>6000 мм</option>
                                        <option value="12000">12000 мм</option>
                                    </select>
                                </div>
                                <div class="control-group">
                                    <label for="kerfSelect">Ширина реза:</label>
                                    <select id="kerfSelect">
                                        <option value="0">0 мм</option>
                                        <option value="1" selected>1 мм</option>
                                        <option value="1.6">1.6 мм</option>
                                        <option value="2">2 мм</option>
                                        <option value="3">3 мм</option>
                                    </select>
                                </div>
                                <div class="control-group">
                                    <label for="multiplicity">Кратность:</label>
                                    <input type="number" id="multiplicity" value="1" min="1">
                                </div>
                            </div>

                            <button type="button" id="cutButton" class="cut-btn">Раскроить</button>
                        </div>

                        <div id="results-container" class="cutting-results">
                            <!-- Результаты раскроя будут вставлены сюда -->
                        </div>
                        <div id="summary-container" class="summary" style="display: none;">
                            <!-- Общая сводная информация будет здесь -->
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Контейнер для данных проекта -->
    <div id="project-data" style="display: none;"></div>

    <!-- Three.js библиотеки -->
    <script type="importmap">
    {
        "imports": {
            "three": "./js/three.js/three.module.min.js",
            "three/addons/": "./js/three.js/",
            "three/utils/": "./js/three.js/utils/"
        }
    }
    </script>

    <!-- Модули приложения (порядок важен: зависимости первыми) -->
    <!-- specification.js, cutting.js, 2d-viewer.js загружаются динамически из ui-managers.js -->
    <script src="js/app.js" type="module"></script>
    <script src="js/plugin-system.js" type="module"></script>
    <script src="js/engine.js" type="module"></script>
    <script src="js/3d-viewer.js" type="module"></script>
    <script src="js/ui-managers.js" type="module"></script>
</body>

</html>
